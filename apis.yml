aid: videogen-io
name: VideoGen
image: https://storage.googleapis.com/videogen-assets/website/cover.jpg
description: VideoGen provides an AI-powered platform that automates video creation from scripts, voiceovers, and storyboards. Users can generate
  explainer videos, ads, tutorials, and social media clips at scale via a single API call. The service includes tools for text‑to‑video, image‑to‑video,
  AI avatars, and customizable workflows, targeting creators, marketers, and enterprises seeking fast, cost‑effective video production.
