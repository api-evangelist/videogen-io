- aid: videogen-io:videogen-io-assistant-api
  name: VideoGen Assistant API
  description: >-
    Converse with the VideoGen AI assistant inside a project. Start a chat, send messages, and act on
    the assistant's suggestions (pick a workflow, approve a plan, generate). All calls are asynchronous:
    POSTing a message returns a `messageId` (e.g. `vg_mesg_...`); poll `GET /v1/assistant-messages/{messageId}`
    until `status` is `succeeded`, `failed`, or `cancelled`, or subscribe to `assistant_message.*` webhooks.
  humanURL: https://docs.videogen.io
  baseURL: https://api.videogen.io
